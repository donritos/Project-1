[project]
name = "collision-risk"
version = "0.1.0"
description = "Satellite conjunction triage: collision-risk prediction engine for CDM streams"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
challenger = ["catboost>=1.2"]
app = ["streamlit>=1.35", "plotly>=5.20"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
collision-risk = "collision_risk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collision_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
