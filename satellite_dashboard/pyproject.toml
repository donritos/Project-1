[project]
name = "satellite-dashboard"
version = "0.1.0"
description = "Decision-support dashboard for final-tier conjunction forecasts (Autonomous SG 2026, Challenge #1)"
readme = "README.md"
requires-python = ">=3.11,<3.12"   # matches the model package (collision-risk)
dependencies = [
    "collision-risk",              # the trained model package, one folder up (see [tool.uv.sources])
    "streamlit>=1.50,<2",
    "plotly>=6.0,<7",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
collision-risk = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satellite_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
